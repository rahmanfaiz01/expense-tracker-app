[project]
name = "expense-tracker-backend"
version = "0.1.0"
description = "Expense Tracker backend API (FastAPI)"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.111,<0.116",
    "uvicorn[standard]>=0.29,<0.31",
    "sqlalchemy>=2.0,<2.1",
    "psycopg[binary]>=3.1,<3.3",
    "alembic>=1.13,<1.14",
    "pydantic[email]>=2.7,<3.0",
    "pydantic-settings>=2.2,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<9.0",
    "httpx>=0.27,<0.28",
    "ruff>=0.6,<0.7",
    "mypy>=1.10,<2.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["app"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.10"
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true
files = ["app"]

[tool.pytest.ini_options]
testpaths = ["app/tests"]
addopts = "-q"
